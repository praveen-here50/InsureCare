server:
  port: ${PORT:8080}
  servlet:
    # Signed-in sessions live on the server; the browser holds only this cookie.
    session:
      timeout: 8h
      cookie:
        name: INSURECARE_SESSION
        http-only: true
        same-site: lax
        # Set to true when the portals are served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: insurecare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurecare}
    username: ${DB_USER:insurecare}
    password: ${DB_PASSWORD:insurecare}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
    # Streamed responses (the assistant's answers) may take this long to finish.
    async:
      request-timeout: 120s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

insurecare:
  # Comma-separated browser origins allowed to call the API and open the live-updates socket; * matches any part, e.g. http://192.168.*:3000.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # Load seed.json into an empty database on startup, and create demo sign-in accounts when there are none.
  seed: ${SEED_DATA:true}
  # Put the demo data back as it started on this schedule (cron, in the zone below), e.g. "0 0 3 * * *" for 3 AM daily.
  # Undoes visitors' changes and deletes their uploads on a public demo. Blank means never; needs SEED_DATA.
  demo-reset: ${DEMO_RESET:}
  # Password of every demo account (members sign in with their member ID, e.g. IC-7842).
  demo-password: ${DEMO_PASSWORD:insurecare}
  # Dates shown in the portals ("today", "Just now") use this zone.
  zone: Asia/Kolkata
  # The insurer portal is operated by this insurer; it sees claims and policyholders for this name only.
  insurer-name: CarePlus Insurance
  # Document verifier (verifier/): OCR, error level analysis and the AI-image model. Runs locally; blank turns those checks off.
  verifier-url: ${VERIFIER_URL:http://localhost:8000}
  # Ask InsureCare, the patient assistant: answers from the member's own records with an OpenAI-compatible chat API
  # (Groq's free tier by default; key from console.groq.com). A blank key turns it off.
  assistant:
    url: ${ASSISTANT_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${ASSISTANT_MODEL:openai/gpt-oss-120b}
    # Questions one signed-in visitor may ask per hour, so one person can't use up the free tier for everyone; 0 for no limit.
    questions-per-hour: ${ASSISTANT_QUESTIONS_PER_HOUR:10}

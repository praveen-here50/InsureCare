server:
  port: ${PORT:8080}

spring:
  application:
    name: insurecare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurecare}
    username: ${DB_USER:insurecare}
    password: ${DB_PASSWORD:insurecare}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

insurecare:
  # Comma-separated browser origins allowed to call the API and open the live-updates socket.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # Load seed.json into an empty database on startup.
  seed: ${SEED_DATA:true}
  # Dates shown in the portals ("today", "Just now") use this zone.
  zone: Asia/Kolkata
  # The insurer portal is operated by this insurer; it sees claims and policyholders for this name only.
  insurer-name: CarePlus Insurance
  # Document verifier (verifier/): OCR, error level analysis and the AI-image model. Runs locally; blank turns those checks off.
  verifier-url: ${VERIFIER_URL:http://localhost:8000}
  # Ask InsureCare, the patient assistant: answers from the member's own records with an OpenAI-compatible chat API
  # (Groq's free tier by default; key from console.groq.com). A blank key turns it off.
  assistant:
    url: ${ASSISTANT_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${ASSISTANT_MODEL:openai/gpt-oss-120b}

# Local stack: PostgreSQL, the Spring Boot backend and the document verifier.
#   docker compose up -d          # database, verifier and API on http://localhost:8080
#   docker compose up -d postgres # database only, when running the backend from your IDE
# The frontend runs separately: cd frontend && npm run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: insurecare
      POSTGRES_USER: insurecare
      POSTGRES_PASSWORD: insurecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurecare -d insurecare"]
      interval: 5s
      retries: 10

  # OCR, error level analysis and the AI-image classifier for claim documents (verifier/).
  # Runs locally and offline: documents never leave this machine.
  verifier:
    build: ./verifier
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      verifier:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/insurecare
      DB_USER: insurecare
      DB_PASSWORD: insurecare
      # Browser origins allowed to sign in and open the live-updates socket. Add e.g. http://192.168.*:3000 in .env to use a phone.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      VERIFIER_URL: http://verifier:8000
      # Ask InsureCare (patient assistant). Set it in your shell or a .env file next to this one; blank turns the assistant off.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-openai/gpt-oss-120b}
      ASSISTANT_QUESTIONS_PER_HOUR: ${ASSISTANT_QUESTIONS_PER_HOUR:-10}
      # Cron schedule for putting the demo data back as it started, e.g. "0 0 3 * * *"; blank means never.
      DEMO_RESET: ${DEMO_RESET:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:

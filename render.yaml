# Render Blueprint for the backend API (Render dashboard: New > Blueprint, pick this repository).
# The frontend runs on Vercel and the database on Neon; see "Deploy" in README.md.
services:
  - type: web
    name: insurecare-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # From Neon: jdbc:postgresql://<host>/<database>?sslmode=require, with the user and password separately.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The Vercel site, plus its preview deployments, e.g. https://insurecare.vercel.app,https://insurecare-*.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SEED_DATA
        value: "true"
      # Every night at 3 AM India time, put the demo data back as it started.
      - key: DEMO_RESET
        value: "0 0 3 * * *"
      - key: ASSISTANT_QUESTIONS_PER_HOUR
        value: "10"
